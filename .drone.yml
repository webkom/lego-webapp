---
kind: pipeline
type: docker
name: default

trigger:
  event:
    exclude:
      - pull_request

steps:
  - name: postgres
    image: postgres:17
    detach: true
    environment:
      POSTGRES_USER: lego
      POSTGRES_HOST_AUTH_METHOD: trust
    when: &checks
      event: [push]
      branch:
        exclude: [build]

  - name: garage
    image: dxflrs/garage:v2.3.0
    detach: true
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: lego-dev
      GARAGE_DEFAULT_SECRET_KEY: lego-dev-secret-key
      GARAGE_DEFAULT_BUCKET: lego
      GARAGE_CONFIG_FILE: /drone/src/.drone/garage.toml
    command:
      - /garage
      - server
      - --single-node
      - --default-bucket
    when: *checks

  - name: thumbor
    image: minimalcompact/thumbor:6.7.5
    detach: true
    environment:
      SECURITY_KEY: 'lego-dev'
      MAX_WIDTH: '1000'
      MAX_HEIGHT: '800'
      QUALITY: '98'
      ALLOW_UNSAFE_URL: '0'
      ALLOW_OLD_URLS: '0'
      AWS_ACCESS_KEY_ID: 'lego-dev'
      AWS_SECRET_ACCESS_KEY: 'lego-dev-secret-key'
      TC_AWS_LOADER_BUCKET: lego
      TC_AWS_REGION: eu-north-1
      TC_AWS_ENDPOINT: 'http://garage:3900'
      LOADER: tc_aws.loaders.s3_loader
    when: *checks

  - name: redis
    image: redis
    detach: true
    when: *checks

  - name: api
    image: registry.webkom.dev/webkom/lego:latest
    detach: true
    pull: true
    commands:
      - ./wait-for-it.sh -t 60 postgres:5432
      - ./wait-for-it.sh -t 60 redis:6379
      - ./wait-for-it.sh -t 60 garage:3900
      - ./wait-for-it.sh -t 60 thumbor:80
      - cd /app
      - python manage.py reset_db --noinput
      - python manage.py migrate
      - python manage.py load_fixtures --development
      - python manage.py runserver 0.0.0.0:8000
    environment:
      PORT: '8000'
      ALLOWED_HOSTS: '*,'
      DATABASE_URL: 'postgres://lego@postgres:5432/lego'
      SECRET_KEY: 'abc123'
      SERVER_URL: 'http://api:8000'
      FRONTEND_URL: 'http://frontend:3000'
      CACHE_URL: 'rediscache://redis/0?client_class: django_redis.client.DefaultClient'
      OAUTH_CACHE: 'redis://redis/9'
      EMAIL_URL: 'smtp://localhost'
      AWS_ACCESS_KEY_ID: 'lego-dev'
      AWS_SECRET_ACCESS_KEY: 'lego-dev-secret-key'
      AWS_REGION: 'eu-north-1'
      AWS_S3_BUCKET: 'lego'
      AWS_ENTRYPOINT: 'http://garage:3900'
      THUMBOR_SERVER: 'http://thumbor:80'
      THUMBOR_SECURITY_KEY: 'lego-dev'
      SENTRY: 'http://sentry:sentry@localhost/2'
      CELERY_BROKER_URL: 'redis://redis/1'
      CHANNELS_REDIS_URL: 'redis://redis/2'
      STRIPE_API_KEY: '123'
      STRIPE_WEBHOOK_SECRET: '123'
      CAPTCHA_KEY: '123'
      PLAUSIBLE_KEY: 'lego-dev'
      LDAP_SERVER: 'localhost'
      LDAP_USER: '123'
      LDAP_PASSWORD: '123'
      APNS_CERTIFICATE: '123'
      SEARCH_BACKEND: 'postgres'
      ELASTICSEARCH_HOST: 'ignored'
      CORS_ORIGIN_DOMAINS: 'frontend:3000'
    when: *checks

  - name: legocypresshelper
    image: abakus/lego-cypress-helper:latest
    detach: true
    pull: true
    when: *checks
    environment:
      PG_HOST: postgres
      PG_USERNAME: lego
      PG_DATABASE: lego
    commands:
      - cd /app
      - ./wait-for-it.sh -t 420 api:8000
      - node index.js
      - echo "server stopped"

  - name: setup
    image: node:26-alpine
    when: *checks
    depends_on:
      - clone
    volumes:
      - name: pnpm-store
        path: /drone/src/.pnpm-store
    environment:
      CYPRESS_INSTALL_BINARY: 0
    commands:
      - apk --no-cache add curl
      - npm i -g corepack
      - corepack enable
      - pnpm config set store-dir .pnpm-store
      - pnpm install --frozen-lockfile

  - name: build
    image: node:26-alpine
    when: *checks
    depends_on:
      - setup
    commands:
      - npm i -g corepack
      - corepack enable
      - pnpm build

  - name: test
    image: node:26-alpine
    when: *checks
    depends_on:
      - setup
    commands:
      - npm i -g corepack
      - corepack enable
      - pnpm test

  - name: lint
    image: node:26-alpine
    when: *checks
    depends_on:
      - setup
    commands:
      - npm i -g corepack
      - corepack enable
      - pnpm lint

  - name: typescript
    image: node:26-slim
    when: *checks
    depends_on:
      - setup
    commands:
      - npm i -g corepack
      - corepack enable
      - pnpm types
    failure: ignore

  - name: audit
    image: node:26-alpine
    when: *checks
    depends_on:
      - clone
    commands:
      - npm i -g corepack
      - corepack enable
      - pnpm audit --prod
    failure: ignore

  - name: install_cypress
    image: node:26-alpine
    when: *checks
    depends_on:
      - setup
    volumes:
      - name: cypress-cache
        path: /cypress-cache
    environment:
      CYPRESS_CACHE_FOLDER: /cypress-cache
    commands:
      - npm i -g corepack
      - corepack enable
      - pnpm --filter lego-webapp exec cypress install

  - name: frontend
    image: node:26-alpine
    detach: true
    when: *checks
    depends_on:
      - build
    environment:
      API_URL: http://api:8000/api/v1
      BASE_URL: http://api:8000
      WS_URL: ws://api:8000
      ENVIRONMENT: ci
    commands:
      - npm i -g corepack
      - corepack enable
      - pnpm --filter lego-webapp preview

  - name: cypress_e2e
    image: cypress/browsers:node-26.0.0-chrome-148.0.7778.96-1-ff-150.0.1-edge-147.0.3912.98-1
    shm_size: 512m
    ipc: host
    when: *checks
    depends_on:
      - legocypresshelper
      - install_cypress
      - frontend
    volumes:
      - name: cypress-cache
        path: /cypress-cache
    environment:
      TZ: Europe/Oslo
      CYPRESS_API_BASE_URL: http://api:8000
      CYPRESS_RESET_DB_API: http://legocypresshelper:3030
      CYPRESS_BASE_URL: http://frontend:3000
      CYPRESS_CACHE_FOLDER: /cypress-cache
      CYPRESS_RECORD_KEY:
        from_secret: cypress_record_key
    commands:
      - ./wait-for-it.sh -t 180 frontend:3000
      - ./wait-for-it.sh -t 480 api:8000
      - ./wait-for-it.sh -t 60 legocypresshelper:3030
      - npm i -g corepack
      - corepack enable
      - pnpm --filter lego-webapp exec cypress run --e2e --record

  - name: cypress_component
    image: cypress/browsers:node-26.0.0-chrome-148.0.7778.96-1-ff-150.0.1-edge-147.0.3912.98-1
    when: *checks
    depends_on:
      - install_cypress
      - build
    volumes:
      - name: cypress-cache
        path: /cypress-cache
    environment:
      TZ: Europe/Oslo
      CYPRESS_CACHE_FOLDER: /cypress-cache
    commands:
      - npm i -g corepack
      - corepack enable
      - pnpm --filter lego-webapp exec cypress run --component --config video=false,screenshotOnRunFailure=false

  - name: docker
    image: plugins/docker
    when:
      branch:
        - build
      event: push
      status: success
    depends_on:
      - build
      - test
      - lint
      - typescript
      - frontend
      - cypress_e2e
      - cypress_component
    environment:
      SENTRY_AUTH_TOKEN:
        from_secret: sentry_auth_token
    settings:
      registry: https://registry.webkom.dev
      repo: registry.webkom.dev/webkom/lego-webapp
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      tags:
        - version-${DRONE_COMMIT_SHA:0:7}
        - latest
      build_args:
        - RELEASE=version-${DRONE_COMMIT_SHA:0:7}
        - COMMIT_SHA=${DRONE_COMMIT_SHA}
        - SENTRY_ORG=abakus
        - SENTRY_PROJECT=lego-webapp
        - SENTRY_URL=https://sentry.io/
      build_args_from_env:
        - SENTRY_AUTH_TOKEN

  - name: Deploy
    image: abakus/ansible-deploy
    settings:
      playbook: /infrastructure/lego/playbooks/deploy.yml
      repository:
        from_secret: infra_repository
      tags:
        - webapp
        - ci
      limit: ${DRONE_DEPLOY_TO}
      extra_vars: webapp_version=version-${DRONE_COMMIT_SHA:0:7}
      inventory: /infrastructure/inventory
      vault_password:
        from_secret: ansible_vault_password
      private_key:
        from_secret: infra_deploy_key
    when:
      event:
        - promote
        - rollback
      branch:
        - build

volumes:
  - name: pnpm-store
    host:
      path: /tmp/drone-cache/pnpm
  - name: cypress-cache
    host:
      path: /tmp/drone-cache/cypress

image_pull_secrets:
  - dockerconfigjson

---
kind: signature
hmac: 9624ca6211c89a4b4cf21ad4b8616d312a12158bbc1f82810b19ef5ef9dd55ef

...
